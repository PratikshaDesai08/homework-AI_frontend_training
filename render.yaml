# Render blueprint: deploys the NestJS API in backend/ as a free web service.
# Render dashboard → New → Blueprint → pick this repo. It reads this file.
services:
  - type: web
    name: student-admin-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /api/v1/students?limit=1
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Frontends allowed to call the API (comma-separated)
      - key: CORS_ORIGINS
        value: https://homework-ai-frontend-training.vercel.app,http://localhost:3000
      # Free plan has no persistent disk: the file is recreated (and re-seeded with 25 students) on every deploy/restart
      - key: DATABASE_PATH
        value: data/students.sqlite
