<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Student list — loading</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2453D6}a:hover{color:#1A3FA8}
</style>
</helmet>
<div style="min-height: 100%; background: #F5F6F8; font-family: 'Public Sans', system-ui, sans-serif; color: #1B2330; font-size: 14px; line-height: 150%">

  <!-- Top bar -->
  <header style="background: #FFFFFF; border-bottom: 1px solid #E3E6EB">
    <div style="max-width: 1360px; margin: 0 auto; padding: 14px 40px; display: flex; align-items: center; justify-content: space-between; gap: 16px">
      <div style="display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 16px">
        <span style="width: 28px; height: 28px; border-radius: 6px; background: #2453D6; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 13px">SA</span>
        Student Admin
      </div>
      <span style="width: 32px; height: 32px; border-radius: 50%; background: #E6EDFC; color: #2453D6; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 12px">PP</span>
    </div>
  </header>

  <main style="max-width: 1360px; margin: 0 auto; padding: 32px 40px 48px; display: flex; flex-direction: column; gap: 24px">

    <!-- Page heading (real, not skeleton: it never waits for data) -->
    <div style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px">
      <div style="display: flex; flex-direction: column; gap: 4px">
        <h1 style="margin: 0; font-size: 28px; line-height: 120%; font-weight: 700">Students</h1>
        <p style="margin: 0; color: #5B6575">View and manage every enrolled student.</p>
      </div>
      <button type="button" style="display: inline-flex; align-items: center; gap: 8px; padding: 10px 18px; min-height: 44px; border: 0; border-radius: 8px; background: #2453D6; color: #FFFFFF; font: inherit; font-weight: 600; cursor: pointer">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        Add student
      </button>
    </div>

    <!-- List card: filters usable, rows replaced by skeletons -->
    <section aria-busy="true" style="background: #FFFFFF; border: 1px solid #E3E6EB; border-radius: 12px; display: flex; flex-direction: column">
      <div style="padding: 16px 20px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px; border-bottom: 1px solid #E3E6EB">
        <div style="flex: 1 1 280px; height: 44px; border: 1px solid #CDD2DA; border-radius: 8px; display: flex; align-items: center; padding: 0 12px; color: #5B6575">Search by name or email</div>
        <div style="width: 150px; height: 44px; border: 1px solid #CDD2DA; border-radius: 8px"></div>
        <div style="width: 150px; height: 44px; border: 1px solid #CDD2DA; border-radius: 8px"></div>
      </div>
      <div style="height: 42px; background: #F9FAFB"></div>
      <sc-for list="{{rows}}" as="row" hint-placeholder-count="8">
        <div style="padding: 14px 20px; display: grid; grid-template-columns: 2.4fr 1.2fr 0.8fr 1fr 0.8fr 0.8fr; gap: 24px; align-items: center; border-top: 1px solid #EDEFF2">
          <div style="display: flex; align-items: center; gap: 12px">
            <span style="flex: none; width: 36px; height: 36px; border-radius: 50%; background: #ECEEF2"></span>
            <div style="display: flex; flex-direction: column; gap: 6px; flex: 1">
              <span style="height: 12px; width: 60%; border-radius: 6px; background: #ECEEF2"></span>
              <span style="height: 10px; width: 80%; border-radius: 6px; background: #F2F4F6"></span>
            </div>
          </div>
          <span style="height: 12px; width: 80%; border-radius: 6px; background: #ECEEF2"></span>
          <span style="height: 20px; width: 64px; border-radius: 999px; background: #ECEEF2"></span>
          <span style="height: 12px; width: 70%; border-radius: 6px; background: #ECEEF2"></span>
          <span style="height: 12px; width: 60%; justify-self: end; border-radius: 6px; background: #ECEEF2"></span>
          <span style="height: 12px; width: 70%; justify-self: end; border-radius: 6px; background: #F2F4F6"></span>
        </div>
      </sc-for>
      <p style="margin: 0; padding: 14px 20px; border-top: 1px solid #E3E6EB; color: #5B6575">Loading students…</p>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
renderVals() {
return { rows: [1, 2, 3, 4, 5, 6, 7, 8] };
}
}
</script>
</body>
</html>
