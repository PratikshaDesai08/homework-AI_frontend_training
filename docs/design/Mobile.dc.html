<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Student list — mobile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2453D6}a:hover{color:#1A3FA8}
</style>
</helmet>
<div style="min-height: 100%; background: #F5F6F8; font-family: 'Public Sans', system-ui, sans-serif; color: #1B2330; font-size: 14px; line-height: 150%">

  <!-- Top bar -->
  <header style="background: #FFFFFF; border-bottom: 1px solid #E3E6EB">
    <div style="padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px">
      <div style="display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 15px">
        <span style="width: 28px; height: 28px; border-radius: 6px; background: #2453D6; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 12px">SA</span>
        Student Admin
      </div>
      <span style="width: 32px; height: 32px; border-radius: 50%; background: #E6EDFC; color: #2453D6; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 12px">PP</span>
    </div>
  </header>

  <main style="padding: 20px 16px 32px; display: flex; flex-direction: column; gap: 16px">

    <!-- Page heading: button wraps under the title -->
    <div style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <h1 style="margin: 0; font-size: 22px; line-height: 120%; font-weight: 700">Students</h1>
        <p style="margin: 0; color: #5B6575; font-size: 13px">View and manage every enrolled student.</p>
      </div>
      <button type="button" style="display: inline-flex; align-items: center; gap: 8px; padding: 10px 16px; min-height: 44px; border: 0; border-radius: 8px; background: #2453D6; color: #FFFFFF; font: inherit; font-weight: 600">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        Add student
      </button>
    </div>

    <section style="background: #FFFFFF; border: 1px solid #E3E6EB; border-radius: 12px; display: flex; flex-direction: column; min-width: 0">

      <!-- Filters stack: search full row, selects share the next row -->
      <div style="padding: 12px; display: flex; flex-wrap: wrap; gap: 8px; border-bottom: 1px solid #E3E6EB">
        <label style="flex: 1 1 100%; display: flex; align-items: center; gap: 8px; padding: 0 12px; min-height: 44px; border: 1px solid #CDD2DA; border-radius: 8px; color: #5B6575">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search students</span>
          <input type="search" placeholder="Search by name or email" style="flex: 1; min-width: 0; border: 0; outline: 0; font: inherit; color: #1B2330; background: transparent">
        </label>
        <label style="flex: 1 1 120px; display: flex">
          <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Course</span>
          <select style="flex: 1; min-width: 0; min-height: 44px; padding: 0 8px; border: 1px solid #CDD2DA; border-radius: 8px; font: inherit; color: #1B2330; background: #FFFFFF"><option>All courses</option></select>
        </label>
        <label style="flex: 1 1 120px; display: flex">
          <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Status</span>
          <select style="flex: 1; min-width: 0; min-height: 44px; padding: 0 8px; border: 1px solid #CDD2DA; border-radius: 8px; font: inherit; color: #1B2330; background: #FFFFFF"><option>All statuses</option></select>
        </label>
      </div>

      <!-- Table scrolls sideways inside this box only; the page itself never scrolls sideways -->
      <div style="overflow-x: auto">
        <table style="min-width: 760px; width: 100%; border-collapse: collapse; text-align: left">
          <thead>
            <tr style="background: #F9FAFB; color: #5B6575; font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em">
              <th style="padding: 10px 12px; font-weight: 600">Name</th>
              <th style="padding: 10px 12px; font-weight: 600">Course</th>
              <th style="padding: 10px 12px; font-weight: 600">Status</th>
              <th style="padding: 10px 12px; font-weight: 600">Enrolled on</th>
              <th style="padding: 10px 12px; font-weight: 600; text-align: right">Fees paid</th>
            </tr>
          </thead>
          <tbody>
            <sc-for list="{{rows}}" as="row" hint-placeholder-count="6">
              <tr style="border-top: 1px solid #EDEFF2">
                <td style="padding: 10px 12px">
                  <div style="display: flex; flex-direction: column">
                    <span style="font-weight: 600">{{row.name}}</span>
                    <span style="color: #5B6575; font-size: 12px">{{row.email}}</span>
                  </div>
                </td>
                <td style="padding: 10px 12px">{{row.course}}</td>
                <td style="padding: 10px 12px"><span style="{{row.tagStyle}}">{{row.status}}</span></td>
                <td style="padding: 10px 12px; color: #3A4352">{{row.enrolledOn}}</td>
                <td style="padding: 10px 12px; text-align: right">{{row.fees}}</td>
              </tr>
            </sc-for>
          </tbody>
        </table>
      </div>
      <p style="margin: 0; padding: 8px 12px; color: #5B6575; font-size: 12px; border-top: 1px solid #EDEFF2">Swipe the table sideways to see all columns.</p>

      <!-- Pagination: wraps onto two lines -->
      <div style="padding: 12px; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px; border-top: 1px solid #E3E6EB; color: #5B6575">
        <span style="flex: 1 1 100%; text-align: center">Showing 1–10 of 25 students</span>
        <nav aria-label="Pagination" style="display: flex; gap: 4px">
          <button type="button" aria-label="Previous page" disabled style="min-width: 44px; height: 44px; border: 1px solid #E3E6EB; border-radius: 8px; background: #FFFFFF; color: #A3AAB5; font: inherit">‹</button>
          <button type="button" aria-current="page" style="min-width: 44px; height: 44px; border: 0; border-radius: 8px; background: #2453D6; color: #FFFFFF; font: inherit; font-weight: 600">1</button>
          <button type="button" style="min-width: 44px; height: 44px; border: 1px solid #E3E6EB; border-radius: 8px; background: #FFFFFF; color: #1B2330; font: inherit">2</button>
          <button type="button" style="min-width: 44px; height: 44px; border: 1px solid #E3E6EB; border-radius: 8px; background: #FFFFFF; color: #1B2330; font: inherit">3</button>
          <button type="button" aria-label="Next page" style="min-width: 44px; height: 44px; border: 1px solid #E3E6EB; border-radius: 8px; background: #FFFFFF; color: #1B2330; font: inherit">›</button>
        </nav>
      </div>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":375,"height":1500}}'>
class Component extends DCLogic {
renderVals() {
var tag = {
Active: 'display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; background: #E3F4EA; color: #1D6B3F',
Inactive: 'display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; background: #EEF0F3; color: #4A5363',
Graduated: 'display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; background: #E6EDFC; color: #2453D6'
};
var data = [
['Aarav Sharma','aarav.sharma@example.com','Full Stack Web','Active','Aug 12, 2026','₹45,000'],
['Diya Kulkarni','diya.kulkarni@example.com','Data Science','Active','Jul 28, 2026','₹62,500'],
['Rohan Mehta','rohan.mehta@example.com','UI/UX Design','Graduated','Jan 9, 2026','₹38,000'],
['Ananya Iyer','ananya.iyer@example.com','Cloud & DevOps','Active','Sep 2, 2026','₹54,000'],
['Kabir Singh','kabir.singh@example.com','Mobile Development','Inactive','Mar 15, 2026','₹12,000'],
['Meera Joshi','meera.joshi@example.com','Data Science','Active','Aug 30, 2026','₹62,500'],
['Vihaan Reddy','vihaan.reddy@example.com','Full Stack Web','Graduated','Dec 4, 2025','₹105,000'],
['Isha Deshpande','isha.deshpande@example.com','UI/UX Design','Active','Sep 18, 2026','₹19,000'],
['Arjun Nair','arjun.nair@example.com','Cloud & DevOps','Inactive','Feb 21, 2026','₹0'],
['Sara Thomas','sara.thomas@example.com','Mobile Development','Active','Sep 25, 2026','₹27,500']
];
return {
rows: data.map(function (d) {
return { name: d[0], email: d[1], course: d[2], status: d[3], enrolledOn: d[4], fees: d[5], tagStyle: tag[d[3]] };
})
};
}
}
</script>
</body>
</html>
