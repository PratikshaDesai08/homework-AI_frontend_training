<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Student list — filled</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2453D6}a:hover{color:#1A3FA8}
</style>
</helmet>
<div style="min-height: 100%; background: #F5F6F8; font-family: 'Public Sans', system-ui, sans-serif; color: #1B2330; font-size: 14px; line-height: 150%">

  <!-- Top bar -->
  <header style="background: #FFFFFF; border-bottom: 1px solid #E3E6EB">
    <div style="max-width: 1360px; margin: 0 auto; padding: 14px 40px; display: flex; align-items: center; justify-content: space-between; gap: 16px">
      <div style="display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 16px">
        <span style="width: 28px; height: 28px; border-radius: 6px; background: #2453D6; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 13px">SA</span>
        Student Admin
      </div>
      <span style="width: 32px; height: 32px; border-radius: 50%; background: #E6EDFC; color: #2453D6; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 12px">PP</span>
    </div>
  </header>

  <main style="max-width: 1360px; margin: 0 auto; padding: 32px 40px 48px; display: flex; flex-direction: column; gap: 24px">

    <!-- Page heading -->
    <div style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px">
      <div style="display: flex; flex-direction: column; gap: 4px">
        <h1 style="margin: 0; font-size: 28px; line-height: 120%; font-weight: 700">Students</h1>
        <p style="margin: 0; color: #5B6575">View and manage every enrolled student.</p>
      </div>
      <button type="button" style="display: inline-flex; align-items: center; gap: 8px; padding: 10px 18px; min-height: 44px; border: 0; border-radius: 8px; background: #2453D6; color: #FFFFFF; font: inherit; font-weight: 600; cursor: pointer">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        Add student
      </button>
    </div>

    <!-- List card -->
    <section style="background: #FFFFFF; border: 1px solid #E3E6EB; border-radius: 12px; display: flex; flex-direction: column">

      <!-- Filters -->
      <div style="padding: 16px 20px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px; border-bottom: 1px solid #E3E6EB">
        <label style="flex: 1 1 280px; display: flex; align-items: center; gap: 8px; padding: 0 12px; min-height: 44px; border: 1px solid #CDD2DA; border-radius: 8px; color: #5B6575">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search students</span>
          <input type="search" placeholder="Search by name or email" style="flex: 1; min-width: 0; border: 0; outline: 0; font: inherit; color: #1B2330; background: transparent">
        </label>
        <label style="display: flex; flex-direction: column; gap: 0">
          <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Course</span>
          <select style="min-height: 44px; padding: 0 36px 0 12px; border: 1px solid #CDD2DA; border-radius: 8px; font: inherit; color: #1B2330; background: #FFFFFF">
            <option>All courses</option>
            <option>Full Stack Web</option>
            <option>Data Science</option>
            <option>UI/UX Design</option>
            <option>Cloud &amp; DevOps</option>
            <option>Mobile Development</option>
          </select>
        </label>
        <label style="display: flex; flex-direction: column; gap: 0">
          <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Status</span>
          <select style="min-height: 44px; padding: 0 36px 0 12px; border: 1px solid #CDD2DA; border-radius: 8px; font: inherit; color: #1B2330; background: #FFFFFF">
            <option>All statuses</option>
            <option>Active</option>
            <option>Inactive</option>
            <option>Graduated</option>
          </select>
        </label>
      </div>

      <!-- Table (scrolls inside its own box on small screens) -->
      <div style="overflow-x: auto">
        <table style="width: 100%; min-width: 960px; border-collapse: collapse; text-align: left">
          <thead>
            <tr style="background: #F9FAFB; color: #5B6575; font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em">
              <th style="padding: 12px 20px; font-weight: 600">Name</th>
              <th style="padding: 12px 16px; font-weight: 600">Course</th>
              <th style="padding: 12px 16px; font-weight: 600">Status</th>
              <th style="padding: 12px 16px; font-weight: 600">Enrolled on</th>
              <th style="padding: 12px 16px; font-weight: 600; text-align: right">Fees paid</th>
              <th style="padding: 12px 20px; font-weight: 600; text-align: right">Actions</th>
            </tr>
          </thead>
          <tbody>
            <sc-for list="{{rows}}" as="row" hint-placeholder-count="10">
              <tr style="border-top: 1px solid #EDEFF2">
                <td style="padding: 12px 20px">
                  <div style="display: flex; align-items: center; gap: 12px">
                    <span style="flex: none; width: 36px; height: 36px; border-radius: 50%; background: #E6EDFC; color: #2453D6; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 13px">{{row.initials}}</span>
                    <div style="display: flex; flex-direction: column; min-width: 0">
                      <span style="font-weight: 600">{{row.name}}</span>
                      <span style="color: #5B6575; font-size: 13px">{{row.email}}</span>
                    </div>
                  </div>
                </td>
                <td style="padding: 12px 16px">{{row.course}}</td>
                <td style="padding: 12px 16px">
                  <span style="{{row.tagStyle}}">{{row.status}}</span>
                </td>
                <td style="padding: 12px 16px; color: #3A4352">{{row.enrolledOn}}</td>
                <td style="padding: 12px 16px; text-align: right; font-variant-numeric: tabular-nums">{{row.fees}}</td>
                <td style="padding: 12px 20px">
                  <div style="display: flex; justify-content: flex-end; gap: 4px">
                    <button type="button" aria-label="View student" style="width: 36px; height: 36px; border: 0; border-radius: 8px; background: transparent; color: #5B6575; display: flex; align-items: center; justify-content: center; cursor: pointer">
                      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
                    </button>
                    <button type="button" aria-label="Edit student" style="width: 36px; height: 36px; border: 0; border-radius: 8px; background: transparent; color: #5B6575; display: flex; align-items: center; justify-content: center; cursor: pointer">
                      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
                    </button>
                    <button type="button" aria-label="Delete student" style="width: 36px; height: 36px; border: 0; border-radius: 8px; background: transparent; color: #B4232C; display: flex; align-items: center; justify-content: center; cursor: pointer">
                      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg>
                    </button>
                  </div>
                </td>
              </tr>
            </sc-for>
          </tbody>
        </table>
      </div>

      <!-- Pagination -->
      <div style="padding: 14px 20px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; border-top: 1px solid #E3E6EB; color: #5B6575">
        <span>Showing 1–10 of 25 students</span>
        <nav aria-label="Pagination" style="display: flex; align-items: center; gap: 4px">
          <button type="button" aria-label="Previous page" disabled style="min-width: 40px; height: 40px; border: 1px solid #E3E6EB; border-radius: 8px; background: #FFFFFF; color: #A3AAB5; font: inherit">‹</button>
          <button type="button" aria-current="page" style="min-width: 40px; height: 40px; border: 0; border-radius: 8px; background: #2453D6; color: #FFFFFF; font: inherit; font-weight: 600">1</button>
          <button type="button" style="min-width: 40px; height: 40px; border: 1px solid #E3E6EB; border-radius: 8px; background: #FFFFFF; color: #1B2330; font: inherit">2</button>
          <button type="button" style="min-width: 40px; height: 40px; border: 1px solid #E3E6EB; border-radius: 8px; background: #FFFFFF; color: #1B2330; font: inherit">3</button>
          <button type="button" aria-label="Next page" style="min-width: 40px; height: 40px; border: 1px solid #E3E6EB; border-radius: 8px; background: #FFFFFF; color: #1B2330; font: inherit">›</button>
        </nav>
      </div>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1120}}'>
class Component extends DCLogic {
renderVals() {
var tag = {
Active: 'display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; background: #E3F4EA; color: #1D6B3F',
Inactive: 'display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; background: #EEF0F3; color: #4A5363',
Graduated: 'display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; background: #E6EDFC; color: #2453D6'
};
var data = [
['Aarav Sharma','aarav.sharma@example.com','Full Stack Web','Active','August 12, 2026','₹45,000'],
['Diya Kulkarni','diya.kulkarni@example.com','Data Science','Active','July 28, 2026','₹62,500'],
['Rohan Mehta','rohan.mehta@example.com','UI/UX Design','Graduated','January 9, 2026','₹38,000'],
['Ananya Iyer','ananya.iyer@example.com','Cloud & DevOps','Active','September 2, 2026','₹54,000'],
['Kabir Singh','kabir.singh@example.com','Mobile Development','Inactive','March 15, 2026','₹12,000'],
['Meera Joshi','meera.joshi@example.com','Data Science','Active','August 30, 2026','₹62,500'],
['Vihaan Reddy','vihaan.reddy@example.com','Full Stack Web','Graduated','December 4, 2025','₹105,000'],
['Isha Deshpande','isha.deshpande@example.com','UI/UX Design','Active','September 18, 2026','₹19,000'],
['Arjun Nair','arjun.nair@example.com','Cloud & DevOps','Inactive','February 21, 2026','₹0'],
['Sara Thomas','sara.thomas@example.com','Mobile Development','Active','September 25, 2026','₹27,500']
];
return {
rows: data.map(function (d) {
return {
name: d[0], email: d[1], course: d[2], status: d[3], enrolledOn: d[4], fees: d[5],
initials: d[0].split(' ').map(function (p) { return p[0]; }).join(''),
tagStyle: tag[d[3]]
};
})
};
}
}
</script>
</body>
</html>
